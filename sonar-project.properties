sonar.projectKey=jalopezg4_cicd-pipeline-python-cd
sonar.organization=jalopezg4-1
sonar.sources=app
sonar.python.version=3.13
sonar.python.pylint.reportPaths=pylint-report.txt
sonar.python.flake8.reportPaths=flake8-report.txt
sonar.coverage.exclusions=**/tests/**,**/setup.py,app/__init__.py
sonar.python.coverage.reportPaths=coverage.xml
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
# Excluye documentación, workflows (guía, sección 7.2) y reportes generados en el pipeline
sonar.exclusions=README.md,**/*.md,docs/**,.github/**,htmlcov/**,report.html,acceptance-report.html,coverage.xml,pylint-report.txt,flake8-report.txt
